# =============================================================================
# Track A — CANARY Deployment（只有帶 cookie 的 pilot 使用者打得到）
#
# 跟 stable 的差別只有三處：
#   1. name  : ...-canary
#   2. label : version: canary
#   3. replicas: 1  ← 重要，見下方說明
#
# 【為什麼 replicas 必須是 1】
#   你的 app 用 in-memory HttpSession，而 sessionAffinity 在 Istio 下不生效
#   （見 guide Part 6.2）。canary 若開 2 個 pod，pilot 使用者的請求會在兩個
#   canary pod 之間跳，session 找不到就被踢回 Keycloak 重登 —— pilot run 會
#   一直被中斷，測不下去。
#   開 1 個 pod 是最簡單可靠的解法。若真的需要多個 canary pod，就必須在
#   DestinationRule 的 canary subset 上加 consistentHash（見 04 檔案的註解）。
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pmc-epmmformquerygui-canary
  namespace: ea-pmc
  labels:
    app: pmc-epmmformquerygui
    version: canary
spec:
  replicas: 0                    # 【靜止狀態】平時 0；發布時改成 1（見 SOP-apply-only.md）
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 600
  minReadySeconds: 15

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      app: pmc-epmmformquerygui
      version: canary

  template:
    metadata:
      labels:
        app: pmc-epmmformquerygui
        version: canary
      annotations:
        config-version: "1.2.3"                  # 【三處之一】要跟 image / configMap 版本一致
        proxy.istio.io/config: '{"holdApplicationUntilProxyStarts": true}'
    spec:
      serviceAccountName: pmc-epmmformquerygui
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60

      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: app
          # >>> 【三處之一】發布時改成新版本 <<<
          image: your-registry/pmc-epmmformquerygui:1.2.3
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          envFrom:
            - secretRef:
                name: pmc-epmmformquery-secret
          env:
            # 【設定載入路徑 — 完整說明見 20-deployment-stable.yaml 的同一段】
            # 路徑要對上底下 volumeMounts 的 config（mountPath: /app/config）。
            # image 的 Dockerfile:120 內建 SPRING_CONFIG_LOCATION=file:/config/application.yaml，
            # 而這個 repo 從來不往 /config 掛東西 —— 那個路徑找不到檔案，Spring Boot
            # 會丟 ConfigDataLocationNotFoundException，pod 直接 CrashLoopBackOff。
            # Deployment 的 env 會覆蓋 image 的 ENV，所以不需要重建 image。
            # 原本這裡寫的是 SPRING_CONFIG_ADDITIONAL_LOCATION —— 那是另一個變數
            # （merge 語意），它蓋不掉 image 那個同名變數，所以壞路徑依然生效。
            #
            # 【代價】replace 語意，不是 merge：jar 裡的 application.yml 完全不會
            # 被載入，ConfigMap 沒寫的 key 一律退回 Java 的 @Value 預設值。canary
            # 這一側特別要記住這件事 —— US-008 之後兩軌各有自己的 ConfigMap，
            # 「只改 canary 那份」很容易變成「只在 canary 那份漏掉某個 key」，
            # 而漏掉的症狀多半不是啟動失敗，是行為安靜地不一樣。
            # 完整的必備 key 清單見 CANARY-COMPLETE.md 附錄 C，由
            # scripts/validate.sh 檢查 [2]/[3] 釘住。
            - name: SPRING_CONFIG_LOCATION
              value: "file:/app/config/application.yml"
            - name: APP_TRACK
              value: "canary"               # log 裡可以直接分辨
            # 自動分流的主開關。只有 canary 這一份要設 true；stable 維持預設
            # false —— stable 發 cookie 而 canary 沒有 endpoint 的話，
            # 拿到 cookie 的人會被規則 1 送進空的 subset，直接 503。
            #
            # 收工時把這行改成 "false"（連同 image 改回 stable 版），
            # 使用者會在下一次頁面導航被乾淨地送回 stable。
            # 【不要】改用 replicas: 0 收工 —— 見 SOP-apply-only.md。
            - name: APP_CANARY_ENABLED
              value: "true"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name

          resources:
            requests: { memory: "512Mi", cpu: "250m" }
            limits:   { memory: "1Gi",   cpu: "1000m" }

          startupProbe:
            httpGet:
              path: /gui_epmmFormQuery/actuator/health
              port: 8080
            failureThreshold: 30
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /gui_epmmFormQuery/actuator/health
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /gui_epmmFormQuery/actuator/health
              port: 8080
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
            - name: tmp
              mountPath: /tmp
            # Canary pilot 名單。canary 也要掛 —— 它要靠名單把「已經被移除、
            # 但 cookie 還沒過期」的人趕回 stable（CanaryEvictionFilter）。
            - name: canary-pilot
              mountPath: /app/canary          # 【關鍵】掛目錄，不是 subPath
              readOnly: true                  #   subPath 掛的檔案永遠不會更新

      volumes:
        - name: config
          configMap:
            name: pmc-epmmformquery-config-1.2.3   # 【三處之一】
        - name: tmp
          emptyDir: {}
        - name: canary-pilot
          configMap:
            name: pmc-epmmformquery-canary-pilot   # runtime/05-configmap-canary-pilot.yaml
            optional: true                  # 【關鍵】ConfigMap 不存在也不能卡住 pod 啟動
