# =============================================================================
# Track A — STABLE Deployment（正式流量都在這裡）
#
# 命名固定：名稱永遠是 pmc-epmmformquerygui-stable，不帶版本號。
# 每次發布只換 image tag，不新增 Deployment。
#
# 【重要】pod label 的 version: stable 是 DestinationRule 分 subset 的依據，
#         也是 Istio metrics 的 destination_version，不要改動。
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pmc-epmmformquerygui-stable
  namespace: ea-pmc
  labels:
    app: pmc-epmmformquerygui
    version: stable
spec:
  replicas: 2
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 600
  minReadySeconds: 15

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0          # 更新期間不減少可用數

  selector:
    matchLabels:
      app: pmc-epmmformquerygui
      version: stable            # 建立後不可修改

  template:
    metadata:
      labels:
        app: pmc-epmmformquerygui
        version: stable          # Service 用 app 選中；DestinationRule 用 version 分 subset
      annotations:
        # 改 ConfigMap 版本時這個值要跟著改，才會觸發滾動更新
        config-version: "1.2.3"                  # 改 ConfigMap 版本會改動 template → 觸發滾動更新
        # 確保 sidecar 先就緒再啟動 app，避免啟動瞬間的連線失敗
        proxy.istio.io/config: '{"holdApplicationUntilProxyStarts": true}'
    spec:
      serviceAccountName: pmc-epmmformquerygui
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60

      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: pmc-epmmformquerygui
              version: stable

      containers:
        - name: app
          # >>> 發布時只改這一行 <<<
          image: your-registry/pmc-epmmformquerygui:1.2.3
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          envFrom:
            - secretRef:
                name: pmc-epmmformquery-secret
          env:
            # 【設定載入路徑 — 動之前先讀 CANARY-COMPLETE.md 3.1】
            # 這一行是整份 Deployment 裡最容易一次弄死整個環境的地方，而且弄死
            # 之後的錯誤訊息完全不會指向真正的原因，所以註解寫長一點。
            #
            # 有三個值必須互相對得上：
            #   image 的 Dockerfile:120      ENV SPRING_CONFIG_LOCATION=file:/config/application.yaml
            #   這一行 env                    SPRING_CONFIG_LOCATION=file:/app/config/application.yml
            #   底下 volumeMounts 的 config    mountPath: /app/config
            #
            # image 內建的那個路徑【沒有任何東西掛在上面】—— 這個 repo 從來不往
            # /config 掛任何 volume。Spring Boot 2.4+ 遇到一個非 optional: 又找不到
            # 的 spring.config.location 會丟 ConfigDataLocationNotFoundException，
            # pod 直接 CrashLoopBackOff。Deployment 的 env 會覆蓋 image 的 ENV
            # （同名時 env 勝出），所以把這一行指到真正的 mount 點就修好了，
            # 【不需要重建 image】—— 這是刻意的決定：修 k8s 這一側，不動另一個 repo。
            #
            # 原本這裡寫的是 SPRING_CONFIG_ADDITIONAL_LOCATION，那是【另一個變數】，
            # merge 語意（jar 內的 application.yml 先載入、再被外部檔案疊上去）。
            # 它沒有覆蓋掉 image 那個同名的 SPRING_CONFIG_LOCATION，所以 image 的壞
            # 路徑依然生效、pod 依然起不來。要修的是變數名稱，不只是路徑。
            #
            # 【代價，必讀】SPRING_CONFIG_LOCATION 是 replace 語意，不是 merge：
            # jar 裡的 application.yml 從此【完全不會被載入】。ConfigMap 沒寫的每一個
            # key 都不是「退回 jar 裡的設定」，而是退回 Java 的 @Value 預設值。沒有
            # 預設值的那幾個（issuer-uri、app.post-logout-redirect-uri）會讓 pod 起
            # 不來 —— 那反而是安全的，因為它當場炸給你看；真正危險的是有預設值的那些：
            # pod 照樣起來、探針照樣綠燈，只有行為悄悄變了（session 從 8 小時縮成 30
            # 分鐘、cookie 從 __Host-JSESSIONID 變回 JSESSIONID 去跟 Envoy 的親和
            # cookie 撞名、CSP header 整個不送）。
            #
            # 所以掛在這裡的 ConfigMap【必須是完整的】。完整的定義見
            # CANARY-COMPLETE.md 附錄 C，並由 scripts/validate.sh 的檢查 [2]/[3]
            # 逐項釘住。往那份 ConfigMap 刪 key 之前，先讀那兩節。
            - name: SPRING_CONFIG_LOCATION
              value: "file:/app/config/application.yml"
            - name: APP_TRACK               # 方便 log 裡分辨自己是哪一軌
              value: "stable"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name

          resources:
            requests: { memory: "512Mi", cpu: "250m" }
            limits:   { memory: "1Gi",   cpu: "1000m" }

          # --- 探針：liveness 與 readiness 打【不同】的端點 ----------------------
          # 原本三個探針都打 /gui_epmmFormQuery/actuator/health，也就是那個「把所有
          # 依賴都算進去」的聚合端點。共用它的後果是：Keycloak 或下游 API 抖一下，
          # readiness 掉的【同時】liveness 也掉 —— readiness 掉只是暫時退出 Endpoints、
          # 好了就自己回來，liveness 掉卻是讓 kubelet 直接【重啟】pod。於是一次幾秒鐘
          # 的依賴故障被放大成一次全部 pod 的滾動重啟，而重啟會清掉 in-memory 的
          # HttpSession（session 沒有外部儲存，見 3.3）→ 所有人被登出。
          #
          # 分開之後：liveness 只問「JVM 還活著嗎」（livenessState），readiness 才看
          # 依賴（readinessState）。startup 用 readiness 群組 —— 啟動階段要等的正是
          # 「依賴都好了沒」，而且 startupProbe 沒過之前 kubelet 不會跑 liveness，
          # 慢啟動不會被誤判成當機。
          #
          # 這三個路徑不是可以隨便改的字串，它們同時綁著 ConfigMap 的兩個 key：
          #   - management.endpoint.health.probes.enabled: true  → 這兩個端點才存在
          #   - management.endpoints.web.base-path              → 決定前綴
          # 改了 ConfigMap 那兩個 key 卻沒回頭改這裡（或反過來）就是 404 探針。
          # validate.sh 的檢查 [7] 會從 ConfigMap 推出這裡應該長什麼樣再對照。
          #
          # ⚠【已知缺口：這三個探針目前是假的，而且在這個 repo 裡修不掉】
          #   （CANARY-COMPLETE.md 3.6、第 9 章第 9 項）
          #
          #   後端 SecurityConfig 的 permitAll 清單裡只有【沒有前綴】的
          #   /actuator/health 與 /actuator/health/**，但上面那個 base-path 已經把
          #   actuator 整組搬到 /gui_epmmFormQuery/actuator。帶前綴的路徑因此落進
          #   anyRequest().authenticated() → 回 302 導去 Keycloak。
          #   而 kubelet 把 2xx 和 3xx 都算成功，所以底下這三個探針【無條件通過】——
          #   app 整個壞掉也偵測不到，maxUnavailable: 0 想保護的東西一起失效。
          #
          #   附帶損害：kubelet 會跟著那個 302 走到
          #   /gui_epmmFormQuery/oauth2/authorization/keycloak，而該端點會建立一個
          #   HttpSession 來存 in-flight 的 OAuth2 state。三個探針 × 每 10 秒 ×
          #   每個 pod，等於持續製造沒有人用的 session，每個活到 session.timeout
          #   （8 小時）才消失。
          #
          #   修法在【另一個 repo】（dev/spring_oauth2_backend），不在這次的範圍內：
          #   permitAll 要補上 contextPrefix + "/actuator/health" 與
          #   contextPrefix + "/actuator/health/**"。把路徑分成 liveness / readiness
          #   本身仍然是對的（那一行上線的當天就會生效），但在它上線之前，
          #   【不要相信這三個探針的綠燈】—— 判斷 pod 好不好要自己 curl 一次看真正的
          #   status code（第 9 章那一列：curl -o /dev/null -D - <probe path>，
          #   302 就是打到了認證牆）。
          startupProbe:
            httpGet:
              path: /gui_epmmFormQuery/actuator/health/readiness
              port: 8080
            failureThreshold: 30
            periodSeconds: 10               # 最多給 300 秒啟動

          readinessProbe:
            httpGet:
              path: /gui_epmmFormQuery/actuator/health/readiness
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              # 【不要】把這一行改回 readiness 或改回不帶 /liveness 的聚合端點 ——
              # 那正是上面整段在講的那個放大效應。
              path: /gui_epmmFormQuery/actuator/health/liveness
              port: 8080
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3             # 比 readiness 遲鈍，避免雪崩式重啟

          lifecycle:
            preStop:
              exec:
                # 等 endpoint 從所有 sidecar / kube-proxy 移除，消除滾動更新期間的零星 502
                command: ["/bin/sh", "-c", "sleep 10"]

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
            - name: tmp
              mountPath: /tmp
            # Canary pilot 名單。stable 也要掛 —— 發 cookie 的那段程式只有
            # stable pod 跑得到（沒帶 cookie 的請求 100% 進 stable）。
            - name: canary-pilot
              mountPath: /app/canary          # 【關鍵】掛目錄，不是 subPath
              readOnly: true                  #   subPath 掛的檔案永遠不會更新

      volumes:
        - name: config
          configMap:
            name: pmc-epmmformquery-config-1.2.3   # 【三處之一】
        - name: tmp
          emptyDir: {}
        - name: canary-pilot
          configMap:
            name: pmc-epmmformquery-canary-pilot   # runtime/05-configmap-canary-pilot.yaml
            optional: true                  # 【關鍵】ConfigMap 不存在也不能卡住 pod。
                                            #   少了這行，名字打錯就會讓 stable 卡在
                                            #   ContainerCreating —— 從「canary 功能壞掉」
                                            #   升級成「正式環境掛掉」。
