# =============================================================================
# release/ — ConfigMap（每個版本一個檔，檔名帶版本號）
#
# 【apply-only 流程】每次發布「新增」一個這樣的檔案，不要改既有的。
#   1.2.3 上線 → 有 10-configmap-1.2.3.yaml
#   1.3.0 上線 → 新增 10-configmap-1.3.0.yaml（1.2.3 那份留著）
#
# 【為什麼舊的不能刪】回滾 = git revert，revert 之後 Deployment 會引用回
#   舊的 ConfigMap 名稱。那份 ConfigMap 如果已經從 cluster 刪掉，
#   Pod 會卡在 ContainerCreating —— 你就回不去了。
#   保留數量必須 >= 你可能回滾的深度（建議至少 3 個版本）。
#
# 【immutable: true】建立後不可修改，只能新增版本。
#   要改設定就發一個新版本，而不是偷偷改線上的設定。
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: pmc-epmmformquery-config-1.2.3     # ← stable 目前引用這份
  namespace: ea-pmc
  labels:
    app: pmc-epmmformquerygui
    config-version: "1.2.3"
immutable: true
data:
  application.yml: |
    server:
      port: 8080
      forward-headers-strategy: framework

    spring:
      application:
        name: pmc-epmmformquerygui
      security:
        oauth2:
          client:
            registration:
              keycloak:
                client-id: ${KEYCLOAK_CLIENT_ID}
                client-secret: ${KEYCLOAK_CLIENT_SECRET}
                authorization-grant-type: authorization_code
                scope: [openid, profile, email]
                client-name: Keycloak Login
            provider:
              keycloak:
                # 【注意：與 BFF repo 的設定不一致】
                # spring_oauth2_backend 的 application.yml 現在設的是
                #   user-name-attribute: sub
                # 理由寫在那份檔案的註解裡（review F15）：Authentication.getName()
                # 是 token store 的 key，而 OIDC 不保證 preferred_username 穩定唯一
                # —— 一個被回收的帳號名會解析到前一個人的 token。
                #
                # 這份 ConfigMap 是走 SPRING_CONFIG_ADDITIONAL_LOCATION 合併的，
                # 【優先權比 jar 裡的 application.yml 高】，所以這一行會把 sub 蓋回去。
                # 要把兩邊對齊之前，先確認這是有意識的決定，不是漏改。
                #
                # canary 分流不受這一行影響：CanaryUsernames 直接讀
                # OidcUser.getPreferredUsername()，兩種設定下都正確。
                user-name-attribute: preferred_username

    app:
      context-prefix: /gui_epmmFormQuery

      cors:
        allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
        allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,PATCH,OPTIONS}
        allowed-headers: ${CORS_ALLOWED_HEADERS:*}
        allow-credentials: ${CORS_ALLOW_CREDENTIALS:true}
        max-age: ${CORS_MAX_AGE:3600}

      sso:
        custom-logout-url: ${SSO_LOGOUT_URL:}
        post-logout-redirect-uri: ${POST_LOGOUT_REDIRECT_URI}
        logout-redirect-param-name: ${SSO_LOGOUT_REDIRECT_PARAM:redirectUri}

      privilege:
        enabled: ${PRIVILEGE_CHECK_ENABLED:false}

      test-endpoints:
        enabled: ${TEST_ENDPOINTS_ENABLED:false}

      frontend:
        url-prefix: /gui_epmmFormQuery/web
        resource-location: classpath:/gui_epmmFormQuery/web/
        index-path: /gui_epmmFormQuery/web/index.html
        classpath-base: gui_epmmFormQuery/web

      # 自動分流。這些值跟 jar 內建的預設完全一樣，列在這裡只是為了讓維運
      # 一眼看得到「這個版本有這個功能、開關在哪」。
      #
      # 兩個開關都由 Deployment 的 env 決定，不要在這裡寫死：
      #   APP_CANARY_ENABLED — 只有 21-deployment-canary.yaml 設 true
      #   APP_TRACK          — 兩份 Deployment 各自設 stable / canary
      canary:
        enabled: ${APP_CANARY_ENABLED:false}
        track: ${APP_TRACK:stable}
        cookie-max-age: 8h
        cookie-path: /gui_epmmFormQuery
        # 對應 Deployment 的 canary-pilot volumeMount（掛目錄，不是 subPath）
        roster-file: /app/canary/pilot-users.txt
        roster-reload-ms: 30000
        entry-path: /gui_epmmFormQuery/web/

    logging:
      level:
        com.example: INFO
        org.springframework.web.servlet.DispatcherServlet: DEBUG

    management:
      endpoints:
        web:
          base-path: /gui_epmmFormQuery/actuator
          exposure:
            include: health,info,mappings
      endpoint:
        health:
          show-details: when-authorized
