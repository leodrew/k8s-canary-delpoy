# =============================================================================
# release/ — ConfigMap（每個版本一個檔，檔名帶版本號）
#
# 【apply-only 流程】每次發布「新增」一個這樣的檔案，不要改既有的。
#   1.2.3 上線 → 有 10-configmap-1.2.3.yaml
#   1.3.0 上線 → 新增 10-configmap-1.3.0.yaml（1.2.3 那份留著）
#
# 【為什麼舊的不能刪】回滾 = git revert，revert 之後 Deployment 會引用回
#   舊的 ConfigMap 名稱。那份 ConfigMap 如果已經從 cluster 刪掉，
#   Pod 會卡在 ContainerCreating —— 你就回不去了。
#   保留數量必須 >= 你可能回滾的深度（建議至少 3 個版本）。
#
# 【immutable: true】建立後不可修改，只能新增版本。
#   要改設定就發一個新版本，而不是偷偷改線上的設定。
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: pmc-epmmformquery-config-1.2.3     # ← stable 目前引用這份
  namespace: ea-pmc
  labels:
    app: pmc-epmmformquerygui
    config-version: "1.2.3"
immutable: true
data:
  application.yml: |
    server:
      port: 8080
      forward-headers-strategy: framework

    spring:
      application:
        name: pmc-epmmformquerygui
      security:
        oauth2:
          client:
            registration:
              keycloak:
                client-id: ${KEYCLOAK_CLIENT_ID}
                client-secret: ${KEYCLOAK_CLIENT_SECRET}
                authorization-grant-type: authorization_code
                scope: [openid, profile, email]
                client-name: Keycloak Login
                # 【必要，缺了不會啟動失敗但登入一定壞】
                # Spring 自己的預設是 {baseUrl}/login/oauth2/code/{registrationId} ——
                # 【沒有 /gui_epmmFormQuery 前綴】。那個值跟 SecurityConfig 設定的
                # redirectionEndpoint.baseUri 對不上，結果是 Keycloak 回 redirect_uri
                # 不符、或是 callback 根本進不到 app，而且錯誤訊息不會指向這一行。
                # 這一類「漏掉會靜默出錯」的 key 清單見 CANARY-COMPLETE.md 附錄 C.2。
                redirect-uri: "{baseUrl}/gui_epmmFormQuery/login/oauth2/code/{registrationId}"
            provider:
              keycloak:
                # 【必要，缺了 pod 起不來】無預設值。
                # jar 裡的 application.yml 確實有這個 key，但它在 !test profile 的
                # document 裡，而 US-006 之後 Deployment 用的是 SPRING_CONFIG_LOCATION
                # （replace 語意）—— jar 那份【完全不會被載入】，所以沒有東西可以退回。
                # 缺了這一行，OAuth2 client 在啟動階段就建不起來，log 會噴
                #   Unable to resolve Configuration with the provided Issuer
                # 這一行曾經從這份檔案裡被誤刪過（track-b 那份還在，見該檔第 53 行）。
                # 見 CANARY-COMPLETE.md 3.1 與附錄 C.1。
                issuer-uri: ${KEYCLOAK_ISSUER_URI}
                # 【注意：與 BFF repo 的設定不一致】
                # spring_oauth2_backend 的 application.yml 現在設的是
                #   user-name-attribute: sub
                # 理由寫在那份檔案的註解裡（review F15）：Authentication.getName()
                # 是 token store 的 key，而 OIDC 不保證 preferred_username 穩定唯一
                # —— 一個被回收的帳號名會解析到前一個人的 token。
                #
                # 這份 ConfigMap 是走 SPRING_CONFIG_ADDITIONAL_LOCATION 合併的，
                # 【優先權比 jar 裡的 application.yml 高】，所以這一行會把 sub 蓋回去。
                # 要把兩邊對齊之前，先確認這是有意識的決定，不是漏改。
                #
                # canary 分流不受這一行影響：CanaryUsernames 直接讀
                # OidcUser.getPreferredUsername()，兩種設定下都正確。
                user-name-attribute: preferred_username

    app:
      context-prefix: /gui_epmmFormQuery

      # 【必要，缺了 pod 起不來】後端讀的是
      #   @Value("${app.post-logout-redirect-uri}")   ← 【沒有預設值】
      # 所以這個 key 缺席不是「退回某個預設」，而是 Spring 在 bean 建立階段直接丟
      #   Could not resolve placeholder 'app.post-logout-redirect-uri'
      # → 啟動失敗、CrashLoopBackOff。
      #
      # 【注意 key 的路徑】正確的是 app.post-logout-redirect-uri（app.* 頂層），
      # 不是底下那塊 app.sso.post-logout-redirect-uri —— 那是錯的 key 路徑，
      # 後端沒有任何一行程式讀它，看起來有設定其實等於沒設定。
      # （app.sso.* 整塊會在後續的清理裡移除，見 CANARY-COMPLETE.md 附錄 C.4。）
      #
      # 這裡的 ${...:預設} 是 Spring 的佔位語法：環境變數 POST_LOGOUT_REDIRECT_URI
      # 沒設時，退回冒號後面那個字面值。見 CANARY-COMPLETE.md 3.5 與附錄 C.1。
      post-logout-redirect-uri: ${POST_LOGOUT_REDIRECT_URI:{baseUrl}/gui_epmmFormQuery/page/logged-out}

      cors:
        allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
        allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,PATCH,OPTIONS}
        allowed-headers: ${CORS_ALLOWED_HEADERS:*}
        allow-credentials: ${CORS_ALLOW_CREDENTIALS:true}
        max-age: ${CORS_MAX_AGE:3600}

      sso:
        custom-logout-url: ${SSO_LOGOUT_URL:}
        post-logout-redirect-uri: ${POST_LOGOUT_REDIRECT_URI}
        logout-redirect-param-name: ${SSO_LOGOUT_REDIRECT_PARAM:redirectUri}

      privilege:
        enabled: ${PRIVILEGE_CHECK_ENABLED:false}

      test-endpoints:
        enabled: ${TEST_ENDPOINTS_ENABLED:false}

      frontend:
        url-prefix: /gui_epmmFormQuery/web
        resource-location: classpath:/gui_epmmFormQuery/web/
        index-path: /gui_epmmFormQuery/web/index.html
        classpath-base: gui_epmmFormQuery/web

      # 自動分流。這些值跟 jar 內建的預設完全一樣，列在這裡只是為了讓維運
      # 一眼看得到「這個版本有這個功能、開關在哪」。
      #
      # 兩個開關都由 Deployment 的 env 決定，不要在這裡寫死：
      #   APP_CANARY_ENABLED — 只有 21-deployment-canary.yaml 設 true
      #   APP_TRACK          — 兩份 Deployment 各自設 stable / canary
      canary:
        enabled: ${APP_CANARY_ENABLED:false}
        track: ${APP_TRACK:stable}
        cookie-max-age: 8h
        cookie-path: /gui_epmmFormQuery
        # 對應 Deployment 的 canary-pilot volumeMount（掛目錄，不是 subPath）
        roster-file: /app/canary/pilot-users.txt
        roster-reload-ms: 30000
        entry-path: /gui_epmmFormQuery/web/

    logging:
      level:
        com.example: INFO
        org.springframework.web.servlet.DispatcherServlet: DEBUG

    management:
      endpoints:
        web:
          base-path: /gui_epmmFormQuery/actuator
          exposure:
            include: health,info,mappings
      endpoint:
        health:
          show-details: when-authorized
