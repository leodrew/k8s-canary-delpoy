# =============================================================================
# base/ — ServiceAccount
#
# 【base/ 的意義】這一層只在「建置時」與「網路/身分設定變更時」才 apply。
#   每次發布的 pipeline **不要**碰這一層。
#
# 【為什麼要獨立的 SA】Istio 的 workload 身分來自 ServiceAccount。
#   不設的話所有 Pod 都是 sa/default，AuthorizationPolicy 就無法區分
#   ea-pmc 裡的不同服務（見 guide Part 4 步驟 1、Part 9 發現 1）。
#
# stable 與 canary 共用同一個 SA —— 它們是同一個服務的兩個版本，
# 身分應該相同。要區分版本請用 Istio 的 destination_version 標籤。
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pmc-epmmformquerygui
  namespace: ea-pmc
  labels:
    app: pmc-epmmformquerygui
automountServiceAccountToken: false     # 不需要呼叫 K8s API 就關掉，減少攻擊面
                                        # 注意：這不影響 Istio mTLS 身分（那走 SDS）
