# =============================================================================
# release/ — ConfigMap（每個版本一個檔，檔名帶版本號）
#
# 【apply-only 流程】每次發布「新增」一個這樣的檔案，不要改既有的。
#   1.2.3 上線 → 有 10-configmap-1.2.3.yaml
#   1.3.0 上線 → 新增 10-configmap-1.3.0.yaml（1.2.3 那份留著）
#
# 【為什麼舊的不能刪】回滾 = git revert，revert 之後 Deployment 會引用回
#   舊的 ConfigMap 名稱。那份 ConfigMap 如果已經從 cluster 刪掉，
#   Pod 會卡在 ContainerCreating —— 你就回不去了。
#   保留數量必須 >= 你可能回滾的深度（建議至少 3 個版本）。
#
# 【immutable: true】建立後不可修改，只能新增版本。
#   要改設定就發一個新版本，而不是偷偷改線上的設定。
# =============================================================================
#   1. 建立新版本的 ConfigMap（新名稱）
#   2. 改 Rollout template 的 image + configMap.name
#   3. Argo 自動產生新 ReplicaSet（canary），舊的留著當 stable
#
# 【內容與 track-a/00-configmap.yaml 完全相同】
#   兩個 track 的設定內容一樣，差別只在「誰引用它」。
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: pmc-epmmformquery-config-1.2.3     # ← 舊 ReplicaSet（stable）仍引用這份
  namespace: ea-pmc
  labels:
    app: pmc-epmmformquerygui
    config-version: "1.2.3"
immutable: true
data:
  application.yml: |
    server:
      port: 8080
      forward-headers-strategy: framework

    spring:
      application:
        name: pmc-epmmformquerygui
      security:
        oauth2:
          client:
            registration:
              keycloak:
                client-id: ${KEYCLOAK_CLIENT_ID}
                client-secret: ${KEYCLOAK_CLIENT_SECRET}
                authorization-grant-type: authorization_code
                scope: [openid, profile, email]
                client-name: Keycloak Login
            provider:
              keycloak:
                issuer-uri: ${KEYCLOAK_ISSUER_URI}
                # 【必須是 sub】完整說明在 track-a/release/10-configmap-1.2.3.yaml。
                # 摘要：Authentication.getName() 是 InMemoryOAuth2AuthorizedClientService
                # 的 key，而 OIDC 不保證 preferred_username 穩定或唯一 —— Keycloak 的
                # 帳號名可以改、也可以被回收給新人，一旦回收，新的人會解析到前一個人的
                # token（review F15）。Spring 的預設就是 sub，這一行寫出來是為了讓它
                # 不會再被改掉。見 CANARY-COMPLETE.md 附錄 C.2。
                user-name-attribute: sub

    app:
      context-prefix: /gui_epmmFormQuery

      # 【這裡原本有 app.cors.* / app.sso.* / app.test-endpoints.* 三塊，都刪掉了】
      # 完整說明在 track-a/release/10-configmap-1.2.3.yaml 的同一個位置。摘要：
      # 後端沒有任何一行程式讀這三塊（CANARY-COMPLETE.md 附錄 C.4）。要找 CORS
      # 設定的人請看附錄 A —— BFF 是同源架構，SecurityConfig 刻意只留一行
      # // No .cors()（review F4），該回 Access-Control-Allow-Origin 的是對方的
      # 伺服器，在這份 ConfigMap 裡加什麼都不會有效果。
      #
      # 【track-b 尚未補齊，這不是這次刪除造成的】刪掉 app.sso.* 之後這份檔案
      # 就完全沒有登出導向的設定了 —— 但那本來就是沒有程式讀的 key，刪掉不改變
      # 任何行為。正確的 app.post-logout-redirect-uri（以及附錄 C 其餘那一整批
      # key）目前只補在 track-a；track-b 不在這次的範圍內，真要啟用這一軌之前
      # 得先照 track-a 那份補齊，否則 pod 會在啟動階段就 CrashLoopBackOff。

      privilege:
        enabled: ${PRIVILEGE_CHECK_ENABLED:false}

      frontend:
        url-prefix: /gui_epmmFormQuery/web
        resource-location: classpath:/gui_epmmFormQuery/web/
        index-path: /gui_epmmFormQuery/web/index.html
        classpath-base: gui_epmmFormQuery/web

    logging:
      level:
        com.example: INFO
        org.springframework.web.servlet.DispatcherServlet: DEBUG

    management:
      endpoints:
